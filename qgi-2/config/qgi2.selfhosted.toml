# ADDRESSES ARE PLACEHOLDERS. This repo is public, so tailnet IPs are not
# committed. Substitute the real values in your local copy (~/.qgi2/config.toml
# is gitignored) — the names match infra/naming.md.
#
# QGI-2 fully self-hosted — the topology deploy/ brings up.
#
# Every process is yours, so speculation, HiCache and prefix caching are all
# under your control. That is the difference between running the spec and
# approximating it through a gateway.
#
# Ports are the backends' own (:18xxx). They bind 127.0.0.1, so either
# `tailscale serve` them (check infra/tailscale-acl.hujson first — gpu-lane to
# gpu-lane is port-listed, and an ACL miss looks exactly like a bind problem)
# or point base_url at the LiteLLM gateway instead.

[server]
bind = "127.0.0.1:8788"
# graph_dir = "~/.qgi2/graphs"

[persona]
mood = "builder"
profile = "traceable"
allow_mood_switch = false

# --- planner: vidatron GPU0, deploy/launch-qgi2-planner.sh ---
[[engines]]
role = "planner"
engine = "sglang"
base_url = "http://VIDATRON_TAILNET_IP:18033/v1"
model = "QGI-2-Planner"
speculation = "mtp"
speculation_n = 2

# --- worker: vidatron GPU1, already running ---
[[engines]]
role = "worker"
engine = "sglang"
base_url = "http://VIDATRON_TAILNET_IP:18031/v1"
model = "QGI-3.8-27b DFlash"
speculation = "dflash2"
speculation_n = 7

# The worker above serves all three profiles, `deterministic` included:
# DFlash2 runs greedy (measured 2.90-3.45 tok/step on this model), so the
# second MTP worker an earlier revision required here is not needed. It is
# still a valid *optional* addition for c8+ throughput; deploy/README.md has
# the recipe, including the W4A16 quant vegatron's Ampere cards need.
#
# If you relaunch the worker, DSpark K=7 is the measured best for QGI-2's
# serial regime on this hardware:
#   speculation = "dspark"
#   speculation_n = 7

[embedder]
role = "embedder"
engine = "vllm"
base_url = "http://IRIDTRON_TAILNET_IP:11434/v1"
model = "QGI-Embed"
speculation = "off"
speculation_n = 0

# page_size MUST match the servers' --page-size, or the harness pads its stable
# prefix to a boundary the engine does not share and the alignment does nothing.
[hicache]
enabled = true
page_size = 64
io_backend = "kernel"
write_policy = "write_through_selective"
mem_layout = "page_first"
fa3 = false

[hicache.l2]
mode = "ratio"
value = 2.0

# The 27B is a hybrid model: each request pins recurrent-state slots (78.4 MB
# each, no paging) and speculation multiplies them. Declare the pool so
# `qgi2 hicache` sizes it, checks it fits, and emits --max-mamba-cache-size.
[hicache.gdn]
slot_bytes = 78400000
lazy_slots = 4
max_concurrent = 8
speculation = { method = "dflash2", n = 7 }
budget = { total_gb = 96.0, mem_fraction_static = 0.90, weights_gb = 24.5, runtime_gb = 3.5 }
